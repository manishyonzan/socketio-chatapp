<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket.IO chat</title>
    <style>
        :root{
            --bg:#f3f6f9;
            --muted:#64748b;
            --primary:#2563eb;
            --card:#ffffff;
        }

        html,body{height:100%;}
        body {
            margin: 0;
            padding: 1.5rem 1rem 3rem 1rem;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg,#f7fbff,var(--bg));
            color: #0f172a;
        }

        .container{
            max-width: 95vw;
            margin: 0 auto;
            height: 95vh;
            display:flex;
            border-radius:12px;
            overflow:hidden;
            box-shadow:0 10px 30px rgba(15,23,42,0.06);
            background: var(--card);
            border:1px solid rgba(15,23,42,0.04);
        }

        .container-left{
            width:320px;
            min-width:220px;
            background: #fbfdff;
            border-right:1px solid rgba(15,23,42,0.03);
            display:flex;
            flex-direction:column;
            overflow:hidden;
        }

        .container-left h3{ padding:14px 16px; margin:0; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; border-bottom:1px solid rgba(15,23,42,0.03); }

        #conversation-div, #unconnected-div{ padding:12px; overflow:auto; flex:1; }

        .conversation, .container-left--people{
            padding:12px;
            margin-bottom:8px;
            border-radius:10px;
            cursor:pointer;
            /* transition: background .12s ease; */
            transform: .08s ease;
            display:flex;
            flex-direction:column;
            background:transparent;
        }

        .conversation:hover, .container-left--people:hover{ background: rgba(37,99,235,0.06); transform: translateY(-2px); }

        .conversation h4, .container-left--people h4{ margin:0; font-size:15px; color:#0b1220; }
        .conversation h5, .container-left--people h5{ margin:6px 0 0 0; font-size:13px; color:var(--muted); }

        .container-right{ flex:1; display:flex; flex-direction:column; background: linear-gradient(180deg,#fff,#f7fbff); }

        .header{ padding:12px 16px; border-bottom:1px solid rgba(15,23,42,0.03); display:flex; align-items:center; justify-content:space-between; }
        #roomid{ margin:0; font-size:16px; color:#0f172a; }

        #roomInput{ padding:8px 10px; border-radius:8px; border:1px solid rgba(15,23,42,0.06); }

        #messages{ list-style:none; margin:0; padding:16px; overflow:auto; flex:1; display:flex; flex-direction:column; gap:8px; }

        /* chat bubbles */
        #messages>li{ max-width:70%; padding:10px 14px; border-radius:16px; box-shadow:0 2px 6px rgba(2,6,23,0.04); word-wrap:break-word; }
        #messages>li:nth-child(odd){ align-self:flex-start; background:#f1f5f9; color:#0f172a; }
        #messages>li:nth-child(even){ align-self:flex-end; background:linear-gradient(90deg,var(--primary),#60a5fa); color:#fff; }

        #messages>li .meta{ display:block; font-size:11px; color:rgba(0,0,0,0.45); margin-top:6px; }

        #form{ padding:12px; display:flex; gap:8px; align-items:center; border-top:1px solid rgba(15,23,42,0.03); background:transparent; }
        #input{ flex:1; padding:12px 16px; border-radius:999px; border:1px solid rgba(15,23,42,0.06); background:#fff; }
        #input:focus{ outline:none; box-shadow:0 6px 20px rgba(37,99,235,0.08); }
        #form>button{ padding:10px 18px; border-radius:999px; border:none; background:var(--primary); color:#fff; cursor:pointer; box-shadow:0 8px 20px rgba(37,99,235,0.18); }

        @media (max-width: 800px){
            .container{ flex-direction:column; height:92vh; }
            .container-left{ width:100%; height:34vh; order:2; }
            .container-right{ order:1; height:66vh; }
            #roomInput{ display:none; }
        }
    </style>
</head>

<body>
    <h2 id="roomid"></h2>
    <input type="text" id="roomInput" placeholder="Enter Room ID to send" />
    <div class="container">
        <div class="container-left">
            <h3>Messages</h3>
            <div id="conversation-div">
                <div class="conversation">
                    <h4>conversation name</h3>
                        <h5>last message</h5>
                </div>
            </div>

            <h3>all people</h3>

            <div id="unconnected-div">
                <div class="container-left--people">
                    <h4>conversation name</h3>
                        <h5>last message</h5>
                </div>
            </div>

        </div>
        <div class="container-right">
            <ul id="messages"></ul>
            <form id="form" action="">
                <input id="input" autocomplete="off" /><button id="sendBtn">Send</button>
            </form>
        </div>
    </div>


    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io({
            auth: {
                token: `Bearer ${localStorage.getItem('chatapp-token')}`
            }
        });

        let messagesGlobal = []
        let userListGlobal = []

        const setScreen = () => {

            messagesGlobal.forEach((msg, index) => {

                const item = document.createElement('li');
                const chatwindow = document.getElementById('messages');
                // { message: msg.msg, senderId: socket.user.id, content: msg.msg } this is the msg object
                item.textContent = msg.content;
                document.getElementById('messages').appendChild(item);
            })
        }

        setScreen();

        let roomIdGlobal = null;

        socket.on("connect", () => {
            document.getElementById('roomid').innerText = "Room ID: " + socket.id;
        })

        socket.on('chat-message', function (msg) {
            const item = document.createElement('li');
            const chatwindow = document.getElementById('messages');
            // { message: msg.msg, senderId: socket.user.id, content: msg.msg } this is the msg object
            item.textContent = msg.message;
            document.getElementById('messages').appendChild(item);
            chatwindow.scrollTo(0, document.body.scrollHeight);
        });

        function joinRoom(roomId) {
            if (!roomId) return null;
            console.log("joining room:", roomId);
            socket.emit("join-room", roomId);
        }

        joinRoom(roomIdGlobal);


        socket.on("connect_error", (err) => {
            console.error("Connection error:", err.message); // e.g., "Invalid token"
            // Optional: show UI feedback or retry logic
        });

        const sendBtn = document.getElementById('sendBtn');
        const input = document.getElementById('input');
        sendBtn.addEventListener("click", (e) => {
            e.preventDefault();

            if (!roomIdGlobal) return null;
            let roomId = roomIdGlobal;

            // for now 
            if (input.value && roomId) {
                socket.emit('chat-message', { msg: input.value, roomId: roomId });
                input.value = '';
            }
        });

        // get messages and create rooms

        const getRooms = (firstUserId, secondUserId) => {
            fetch('/api/v1/connection/conversations', {
                method: 'GET',
                credentials: 'same-origin',
                headers: {
                    Authorization: `Bearer ${localStorage.getItem('chatapp-token')}`
                }
            })
                .then(async response => {
                    return response.json();
                })
                .then(data => {
                    data.data.forEach(element => {
                        const item = document.createElement("div");
                        item.className = "conversation";
                        item.setAttribute("data-roomid", element.name);
                        const header = document.createElement("h4")
                        header.textContent = element.name;
                        item.appendChild(header);
                        const message = document.createElement("h5")
                        message.textContent = element.type;
                        item.appendChild(message);

                        item.addEventListener("click", () => {
                            const id = item.getAttribute("data-roomid");
                            roomIdGlobal = item.getAttribute("data-roomid");

                            joinRoom(id)

                            const newItem = document.createElement("ul");
                            newItem.id = "messages";
                            document.getElementById('messages').replaceWith(newItem);

                            fetch(`/api/v1/connection/messages/${element.name}`, {
                                method: 'GET',
                                credentials: 'same-origin',
                                headers: {
                                    Authorization: `Bearer ${localStorage.getItem('chatapp-token')}`
                                }
                            })
                                .then(res => res.json())
                                .then(msg => {
                                    messagesGlobal = msg.data;

                                    msg.data.forEach((eachMessage, index) => {
                                        const item = document.createElement('li');
                                        const chatwindow = document.getElementById('messages');
                                        // { message: msg.msg, senderId: socket.user.id, content: msg.msg } this is the msg object
                                        item.textContent = eachMessage.content;
                                        document.getElementById('messages').appendChild(item);
                                        chatwindow.scrollTo(0, document.body.scrollHeight);
                                    })
                                    // handle response
                                })
                                .catch(err => {
                                    console.error("Fetch error:", err);
                                });
                        });



                        const conversationListDiv = document.getElementById("conversation-div");
                        conversationListDiv.appendChild(item);
                    });

                    console.log("Conversation data:", data);
                })
                .catch(error => {
                    console.error('Error creating/getting conversation:', error);
                });
        };

        getRooms();



        // get all users
        const getAllUser = async () => {

            const user = await fetch('/api/v1/authentication/user/allusers', {
                method: 'GET',
                credentials: 'same-origin',
                headers: {
                    Authorization: `Bearer ${localStorage.getItem('chatapp-token')}`
                }

            })
            const data = await user.json()
            userListGlobal = [...data.data]
            console.log(userListGlobal, "all data")



            // creting the userlist ui
            createUserUi(userListGlobal);

        }

        getAllUser();


        const createUserUi = (users) => {
            users.forEach(element => {
                const item = document.createElement("div");
                item.className = "container-left--people";
                item.setAttribute("data-userid", element._id);
                const header = document.createElement("h4")
                header.textContent = element.name;
                item.appendChild(header);
                const message = document.createElement("h5")
                message.textContent = "click to message";
                item.appendChild(message);

                item.addEventListener("click", () => {


                    fetch(`/api/v1/connection/conversations`, {
                        method: 'POST',
                        credentials: 'same-origin',
                        body: JSON.stringify({ type: "private", participants: [item.getAttribute("data-userid")] }),
                        headers: {
                            Authorization: `Bearer ${localStorage.getItem('chatapp-token')}`,
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        }
                    })
                        .then(res => res.json())
                        .then(data => {
                            console.log("on user click", data)
                            userListGlobal = [...userListGlobal, data.data];


                            const item = document.createElement("div");
                            item.className = "conversation";
                            item.setAttribute("data-roomid", data.data.name);
                            const header = document.createElement("h4")
                            header.textContent = data.data.name;
                            item.appendChild(header);
                            const message = document.createElement("h5")
                            message.textContent = data.data.type;
                            item.appendChild(message);

                            item.addEventListener("click", () => {
                                const id = item.getAttribute("data-roomid");
                                roomIdGlobal = item.getAttribute("data-roomid");

                                fetch(`/api/v1/connection/messages/${element.name}`, {
                                    method: 'GET',
                                    credentials: 'same-origin',
                                    headers: {
                                        Authorization: `Bearer ${localStorage.getItem('chatapp-token')}`
                                    }
                                })
                                    .then(res => res.json())
                                    .then(data => {
                                        messagesGlobal = data.data;
                                        // handle response
                                    })
                                    .catch(err => {
                                        console.error("Fetch error:", err);
                                    });
                            });



                            const conversationListDiv = document.getElementById("conversation-div");
                            conversationListDiv.appendChild(item);
                            // handle response
                        })
                        .catch(err => {
                            alert("room was already created with  this user");
                            console.error("Fetch error:", err);
                        });
                });



                const userListDiv = document.getElementById("unconnected-div");
                userListDiv.appendChild(item);
            })
        };




        // create rooms



    </script>

    <script>
        // check whether user is logged in
        const token = localStorage.getItem('chatapp-token');
        if (!token) {
            // redirect to login page
            window.location.href = '/index.html';
        }  
    </script>

</body>

</html>
